[package]
name = "space_apps_rzeszow"
version = "0.1.0"
edition = "2024"
description = "Lunar Landing Site Navigator - NASA Space Apps 2026, Rzeszow"

[dependencies]
anise = "0.10.6"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["fs", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"

[profile.dev.package."*"]
# Dependencies (anise, nalgebra) are math-heavy; optimize them even in dev builds.
opt-level = 2
