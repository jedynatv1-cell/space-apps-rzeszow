<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lunar Landing Site Navigator: Moon &amp; Solar System 3D</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="solar.css?v=20261115n">
<script>
// Three.js 0.170.0: vendored copy in web/vendor/three (works offline); CDN only if it is missing.
// Must run before any module script, so the import map is built synchronously here.
(() => {
  const local = './vendor/three/', cdn = 'https://cdn.jsdelivr.net/npm/three@0.170.0/';
  let base = local;
  try {
    const x = new XMLHttpRequest();
    x.open('HEAD', local + 'build/three.module.min.js', false); x.send();
    if (x.status !== 200) base = cdn;
  } catch { base = cdn; }
  const map = document.createElement('script');
  map.type = 'importmap';
  map.textContent = JSON.stringify({ imports: {
    three: base + 'build/three.module.min.js', 'three/addons/': base + 'examples/jsm/' } });
  document.currentScript.after(map);
})();
</script>
</head>
<body>
<main id="view">
  <div id="loading">Loading the Moon</div>

  <!-- Top: time control. Closed = a small tab with a down arrow; open = 3 buttons + date. -->
  <div id="top" class="closed">
    <div class="bar glass" id="bar">
      <button class="icon" id="back" aria-label="Back one day" title="Back one day">
        <svg viewBox="0 0 24 24"><path d="M11 6 5 12l6 6M19 6l-6 6 6 6"/></svg></button>
      <button class="icon primary" id="play" aria-label="Play" title="Play / pause">
        <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" class="fill"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24"><path d="M8 5h3v14H8zM13 5h3v14h-3z" class="fill"/></svg></button>
      <button class="icon" id="fwd" aria-label="Forward one day" title="Forward one day">
        <svg viewBox="0 0 24 24"><path d="m13 6 6 6-6 6M5 6l6 6-6 6"/></svg></button>
      <span class="divider"></span>
      <button id="date-btn" class="date" aria-expanded="false" aria-controls="picker">
        <span id="date-main">—</span><span id="date-time">—</span>
      </button>
    </div>
    <div id="picker" class="glass" aria-hidden="true">
      <div class="picker-row">
        <label><span>Date</span><input id="date" type="date"></label>
        <label><span>Time UTC</span><input id="time" type="time" step="60"></label>
        <button id="now" class="text">Now</button>
      </div>
    </div>
    <button id="top-toggle" class="tab glass" aria-expanded="false" aria-label="Show time controls">
      <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
    </button>
  </div>

  <!-- Left: translucent settings card. -->
  <aside id="left" class="glass">
    <button id="left-toggle" class="icon small" aria-expanded="true" aria-label="Hide settings">
      <svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>
    </button>
    <div class="left-body">
      <div class="nav-brand"><span class="nav-dot" aria-hidden="true"></span><h1>Lunar Navigator</h1></div>
      <div class="group">
        <div class="label">Landing sites</div>
        <label class="switch"><input type="checkbox" id="cat-hist"><i></i>Historical <small class="n" id="n-hist"></small><span class="key landed"></span><span class="key lost"></span></label>
        <label class="switch"><input type="checkbox" id="cat-planned"><i></i>Planned <small class="n" id="n-planned"></small><span class="key planned"></span></label>
        <label class="switch"><input type="checkbox" id="cat-cand" checked><i></i>Artemis zones <small class="n" id="n-cand"></small><span class="key cand"></span></label>
      </div>
      <div class="group">
        <div class="label">Layers</div>
        <label class="switch"><input type="checkbox" id="opt-labels" checked><i></i>Planet labels</label>
        <label class="switch"><input type="checkbox" id="opt-trails" checked><i></i>Trails</label>
        <label class="switch"><input type="checkbox" id="opt-orbits" checked><i></i>Orbits</label>
        <label class="switch"><input type="checkbox" id="opt-shade" checked><i></i>Day and night</label>
      </div>
      <div class="group">
        <div class="label">View</div>
        <div class="chips">
          <button data-cam="moon">Moon</button>
          <button data-cam="earth">Earth–Moon</button>
          <button data-cam="inner">Inner</button>
          <button data-cam="all">System</button>
        </div>
      </div>
      <p class="credit" id="site-note"></p>
      <a class="link" href="index.html">← Site Analysis Console</a>
      <p class="credit">Moon imagery: NASA SVS CGI Moon Kit (LRO LROC, LOLA)</p>
    </div>
  </aside>

  <!-- Site card: shown above the hovered marker, expands on click. -->
  <div id="card" class="glass" role="dialog" aria-live="polite" hidden></div>
  <div class="embed-hint">Drag to rotate · Scroll to zoom · Click a yellow landing zone to inspect</div>
</main>

<script type="module" src="solar/main.js?v=20261115n"></script>
</body>
</html>
